<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADK Gemini Live API Toolkit Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" type="module"></script>
  </head>

  <body>
    <header>
      <h1>ADK Gemini Live API Toolkit Demo</h1>
      <div class="subtitle">Real-time bidirectional streaming with Google ADK</div>
      <div class="header-options">
        <label class="header-select" title="Select agent voice">
          <span>Voice:</span>
          <select id="voiceSelect">
            <option value="">Default</option>
            <optgroup label="Female">
              <option value="Zephyr">F - Zephyr (Bright)</option>
              <option value="Kore">F - Kore (Firm)</option>
              <option value="Autonoe">F - Autonoe (Bright)</option>
              <option value="Erinome">F - Erinome (Clear)</option>
              <option value="Laomedeia">F - Laomedeia (Upbeat)</option>
              <option value="Aoede">F - Aoede (Breezy)</option>
              <option value="Achernar">F - Achernar (Soft)</option>
              <option value="Gacrux">F - Gacrux (Mature)</option>
              <option value="Leda">F - Leda (Youthful)</option>
              <option value="Callirrhoe">F - Callirrhoe (Easy-going)</option>
              <option value="Despina">F - Despina (Smooth)</option>
              <option value="Pulcherrima">F - Pulcherrima (Forward)</option>
              <option value="Vindemiatrix">F - Vindemiatrix (Gentle)</option>
              <option value="Sulafat">F - Sulafat (Warm)</option>
            </optgroup>
            <optgroup label="Male">
              <option value="Orus">M - Orus (Firm)</option>
              <option value="Umbriel">M - Umbriel (Easy-going)</option>
              <option value="Schedar">M - Schedar (Even)</option>
              <option value="Achird">M - Achird (Friendly)</option>
              <option value="Sadachbia">M - Sadachbia (Lively)</option>
              <option value="Puck">M - Puck (Upbeat)</option>
              <option value="Fenrir">M - Fenrir (Excitable)</option>
              <option value="Enceladus">M - Enceladus (Breathy)</option>
              <option value="Algieba">M - Algieba (Smooth)</option>
              <option value="Algenib">M - Algenib (Gravelly)</option>
              <option value="Zubenelgenubi">M - Zubenelgenubi (Casual)</option>
              <option value="Sadaltager">M - Sadaltager (Knowledgeable)</option>
              <option value="Charon">M - Charon (Informative)</option>
              <option value="Iapetus">M - Iapetus (Clear)</option>
              <option value="Rasalgethi">M - Rasalgethi (Informative)</option>
              <option value="Alnilam">M - Alnilam (Firm)</option>
            </optgroup>
          </select>
        </label>
        <label class="header-checkbox" title="Enable model to proactively respond without explicit prompts (Native audio models only)">
          <input type="checkbox" id="enableProactivity">
          <span>Proactivity</span>
        </label>
        <label class="header-checkbox" title="Enable model to detect and adapt to emotional cues (Native audio models only)">
          <input type="checkbox" id="enableAffectiveDialog">
          <span>Affective Dialog</span>
        </label>
      </div>
      <div class="connection-status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div class="main-layout">
      <div class="container">
        <div id="messages"></div>

        <div class="input-container">
          <form id="messageForm">
            <div class="input-wrapper">
              <input
                type="text"
                id="message"
                name="message"
                placeholder="Type your message here..."
                autocomplete="off"
              />
              <button type="submit" id="sendButton" disabled>Send</button>
              <button type="button" id="startAudioButton">Start Audio</button>
              <button type="button" id="cameraButton">📷 Camera</button>
            </div>
          </form>
        </div>
      </div>

      <div class="console-panel">
        <div class="console-header">
          <h2>Event Console</h2>
          <div class="console-controls">
            <label class="console-checkbox">
              <input type="checkbox" id="showAudioEvents">
              <span>Show audio</span>
            </label>
            <button id="clearConsole" class="console-clear-btn">Clear</button>
          </div>
        </div>
        <div id="consoleContent" class="console-content"></div>
      </div>
    </div>

    <!-- Camera Preview Modal -->
    <div id="cameraModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Camera Preview</h3>
          <button id="closeCameraModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <video id="cameraPreview" autoplay playsinline></video>
        </div>
        <div class="modal-footer">
          <button id="cancelCamera" class="btn-secondary">Cancel</button>
          <button id="captureImage" class="btn-primary">📷 Send Image</button>
        </div>
      </div>
    </div>
  </body>
</html>
