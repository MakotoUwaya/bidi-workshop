<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADK Gemini Live API Toolkit Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" type="module"></script>
  </head>

  <body>
    <header>
      <h1>ADK Gemini Live API Toolkit Demo</h1>
      <div class="subtitle">Real-time bidirectional streaming with Google ADK</div>
      <div class="header-options">
        <label class="header-select" title="Select agent voice">
          <span>Voice:</span>
          <select id="voiceSelect">
            <option value="">Default</option>
            <option value="Zephyr">Zephyr (Bright)</option>
            <option value="Kore">Kore (Firm)</option>
            <option value="Orus">Orus (Firm)</option>
            <option value="Autonoe">Autonoe (Bright)</option>
            <option value="Umbriel">Umbriel (Easy-going)</option>
            <option value="Erinome">Erinome (Clear)</option>
            <option value="Laomedeia">Laomedeia (Upbeat)</option>
            <option value="Schedar">Schedar (Even)</option>
            <option value="Achird">Achird (Friendly)</option>
            <option value="Sadachbia">Sadachbia (Lively)</option>
            <option value="Puck">Puck (Upbeat)</option>
            <option value="Fenrir">Fenrir (Excitable)</option>
            <option value="Aoede">Aoede (Breezy)</option>
            <option value="Enceladus">Enceladus (Breathy)</option>
            <option value="Algieba">Algieba (Smooth)</option>
            <option value="Algenib">Algenib (Gravelly)</option>
            <option value="Achernar">Achernar (Soft)</option>
            <option value="Gacrux">Gacrux (Mature)</option>
            <option value="Zubenelgenubi">Zubenelgenubi (Casual)</option>
            <option value="Sadaltager">Sadaltager (Knowledgeable)</option>
            <option value="Charon">Charon (Informative)</option>
            <option value="Leda">Leda (Youthful)</option>
            <option value="Callirrhoe">Callirrhoe (Easy-going)</option>
            <option value="Iapetus">Iapetus (Clear)</option>
            <option value="Despina">Despina (Smooth)</option>
            <option value="Rasalgethi">Rasalgethi (Informative)</option>
            <option value="Alnilam">Alnilam (Firm)</option>
            <option value="Pulcherrima">Pulcherrima (Forward)</option>
            <option value="Vindemiatrix">Vindemiatrix (Gentle)</option>
            <option value="Sulafat">Sulafat (Warm)</option>
          </select>
        </label>
        <label class="header-checkbox" title="Enable model to proactively respond without explicit prompts (Native audio models only)">
          <input type="checkbox" id="enableProactivity">
          <span>Proactivity</span>
        </label>
        <label class="header-checkbox" title="Enable model to detect and adapt to emotional cues (Native audio models only)">
          <input type="checkbox" id="enableAffectiveDialog">
          <span>Affective Dialog</span>
        </label>
      </div>
      <div class="connection-status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div class="main-layout">
      <div class="container">
        <div id="messages"></div>

        <div class="input-container">
          <form id="messageForm">
            <div class="input-wrapper">
              <input
                type="text"
                id="message"
                name="message"
                placeholder="Type your message here..."
                autocomplete="off"
              />
              <button type="submit" id="sendButton" disabled>Send</button>
              <button type="button" id="startAudioButton">Start Audio</button>
              <button type="button" id="cameraButton">📷 Camera</button>
            </div>
          </form>
        </div>
      </div>

      <div class="console-panel">
        <div class="console-header">
          <h2>Event Console</h2>
          <div class="console-controls">
            <label class="console-checkbox">
              <input type="checkbox" id="showAudioEvents">
              <span>Show audio</span>
            </label>
            <button id="clearConsole" class="console-clear-btn">Clear</button>
          </div>
        </div>
        <div id="consoleContent" class="console-content"></div>
      </div>
    </div>

    <!-- Camera Preview Modal -->
    <div id="cameraModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Camera Preview</h3>
          <button id="closeCameraModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <video id="cameraPreview" autoplay playsinline></video>
        </div>
        <div class="modal-footer">
          <button id="cancelCamera" class="btn-secondary">Cancel</button>
          <button id="captureImage" class="btn-primary">📷 Send Image</button>
        </div>
      </div>
    </div>
  </body>
</html>
